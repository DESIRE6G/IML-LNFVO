lnsd:
  ns-instance-id: "11223344"
  ns:
    name: "Site-to-Site scenario-1"
    id: "aaaabbbb"
    vendor: "D6G"
    descriptor-version: "1.0"
    site-id: "d6g-001"
    location-id: 40
    default-service-id: "30"
    default-nfrouter-mode: "bmv2"
    default-interpod-mode: 'br'

    site-connections:
      - id: "d6g-002"
        ip: "15.15.15.15"
        mac: "02:10:10:10:10:10"
        dstip: "16.16.16.16"
        dstmac: "02:20:20:20:20:20"
        transport-type: "external"
        application-functions: []
        network-functions:
          - instance-id: "dummy"
            id: "reflector-bmv2"
            name: "debug nf"
            version: "1.0"
            static-nfids: [23,26]
            static-mac: "02:66:66:66:66:66"

    unmanaged-functions: []
    network-functions: []

    application-functions:
      - instance-id: "pkt-src"
        id: "iperf3"
        name: "Pkt source"
        version: "1.0"
        node: "epyc1"
        domain: "external"
        static-nfids: [21,24]
        static-mac: "02:55:55:55:55:55"
        static-ip: "11.12.12.12"
        is-ue: true

    forwarding_graphs:
      - graph-name: "upstream"
        direction: "upstream"
        links:
          - id: "upstream-1"
            connection-points:
            - if-id-ref: "pkt-src:1"
            - if-id-ref: "dummy:1"
      - graph-name: "downstream"
        direction: "downstream"
        links:
          - id: "downstream-1"
            connection-points:
            - if-id-ref: "dummy:1"
            - if-id-ref: "pkt-src:1"
