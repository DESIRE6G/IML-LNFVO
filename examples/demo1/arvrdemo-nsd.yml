nsd:
  ns-instance-id: "11223344"
  ns:
    name: "ARVR demo"
    id: "aaaabbbb"
    vendor: "D6G"
    descriptor-version: "1.0"
    location-id: 40
    default-service-id: "30"
    default-nfrouter-mode: "bmv2"
    default-interpod-mode: 'br'

    infra-nfs: []
    network-functions: []
    application-functions:
      - instance-id: "edge"
        id: "iperf3"
        name: "AR edge app"
        version: "1.0"
        domain: "external"
        static-nfids: [44,45]
        static-ips: ["10.30.7.213"]
        is-scalable: true
        instances: 2

      - instance-id: "src"
        id: "iperf3"
        name: "AR source app"
        version: "1.0"
        domain: "external"
        is-ue: true

      - instance-id: "ran"
        id: "iperf3"
        name: "RAN"
        version: "1.0"
        domain: "internal"
        is-ue: true
        static-nfids: [42, 43]
        static-ips: ["192.168.1.4"]

    forwarding_graphs:
      - graph-name: "upstream"
        direction: "upstream"
        links:
          - id: "upstream-1"
            connection-points:
            - if-id-ref: "ran:0"
            - if-id-ref: "edge:0"
      - graph-name: "downstream"
        direction: "downstream"
        links:
          - id: "downstream-1"
            connection-points:
            - if-id-ref: "edge:0"
            - if-id-ref: "ran:0"
