lnsd:
  ns-instance-id: "55667788"
  ns:
    name: "ARVR demo1"
    id: "ccccdddd"
    vendor: "D6G"
    descriptor-version: "1.0"
    site-id: "site2"
    location-id: 40
    default-service-id: "30"
    default-nfrouter-mode: "bmv2"
    default-interpod-mode: 'br'

    infra-nfs: []
    network-functions: []
    site-connections:
      - id: "site1"
        application-functions:
          - instance-id: "src"
            static-nfids: [42,43]
            static-ips: ["192.168.1.4"]
            is-ue: true
        network-functions: []

    application-functions:
      - instance-id: "edge"
        id: "iperf3"
        name: "AR edge app"
        version: "1.0"
        domain: "external"
        static-nfids: [44,45]
        static-ips: ["10.30.7.213"]
        is-scalable: true
        instances: 2

    forwarding_graphs:
      - graph-name: "upstream"
        direction: "upstream"
        links:
          - id: "upstream-1"
            connection-points:
              - if-id-ref: "src:0"
              - if-id-ref: "edge:0"
      - graph-name: "downstream"
        direction: "downstream"
        links:
          - id: "downstream-1"
            connection-points:
              - if-id-ref: "edge:0"
              - if-id-ref: "src:0"
