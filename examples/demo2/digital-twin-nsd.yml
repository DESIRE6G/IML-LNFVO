lnsd:
  ns-instance-id: "22113344"
  ns:
    name: "Digital Twin demo2"
    id: "bbbbcccc"
    vendor: "D6G"
    descriptor-version: "1.0"
    site-id: "site1"
    location-id: 50
    default-service-id: "20"
    default-nfrouter-mode: "bmv2"
    default-interpod-mode: 'br'

    site-connections: []
    infra-nfs: []

    application-functions:

# On edge AF
      - instance-id: "app"
        id: "go1-navigation"
        name: "go1 navigation"
        version: "1.0"
        domain: "external"
        static-ips: ["172.20.50.11"]
        is-scalable: true
        instances: 2
        static-instance-ips: ["10.10.10.11", "10.10.10.12"]

      - instance-id: "ros"
        id: "ros-master"
        name: "ros-master"
        version: "1.0"
        domain: "external"
        static-ips: ["172.20.50.10"]

      - instance-id: "gesture"
        id: "gesture-control"
        name: "gesture control"
        version: "1.0"
        domain: "external"
        static-ips: ["172.20.50.15"]
        shared-bridge: "ros-br-0"

      - instance-id: "twin"
        id: "digital-twin"
        name: "digital twin"
        version: "1.0"
        domain: "external"
        static-ips: ["172.20.50.13"]
        shared-bridge: "ros-br-0"

      - instance-id: "receiver"
        id: "video-receiver"
        name: "video receiver"
        version: "1.0"
        domain: "external"
        static-ips: ["172.20.50.14"]
        shared-bridge: "ros-br-0"

# On robot UE
      - instance-id: "go1-base"
        id: "go1-base"
        name: "Go 1 Base"
        version: "1.0"
        domain: "external"
        is-ue: true
        static-ips: ["172.20.50.7"]
        external-routing: true

      - instance-id: "lidar"
        id: "lidar"
        name: "lidar"
        version: "1.0"
        domain: "external"
        is-ue: true
        static-ips: ["172.20.50.8"]
        external-routing: true

      - instance-id: "streamer"
        id: "video-streamer"
        name: "Video Streamer"
        version: "1.0"
        domain: "external"
        is-ue: true
        static-ips: ["172.20.50.9"]
        external-routing: true

# Pseudo node
      - instance-id: "ran"
        name: "RAN"
        version: "1.0"
        domain: "external"
        is-ue: true
        static-ips: ["172.20.50.7", "172.20.50.8"]
        extra-ueids: [[], ["172.20.50.9"]]

    network-functions:
      - instance-id: "firewall"
        id: "reflector-bmv2"
        name: "Firewall"
        version: "1.0"

    forwarding_graphs:
      - graph-name: "upstream"
        direction: "upstream"
        links:
          - id: "upstream-1"
            connection-points:
              - if-id-ref: "ran:0"
              - if-id-ref: "firewall:0"
          - id: "upstream-2"
            connection-points:
              - if-id-ref: "firewall:0"
              - if-id-ref: "app:0"
      - graph-name: "downstream"
        direction: "downstream"
        links:
          - id: "downstream-1"
            connection-points:
              - if-id-ref: "app:0"
              - if-id-ref: "firewall:0"
          - id: "downstream-2"
            connection-points:
              - if-id-ref: "firewall:0"
              - if-id-ref: "ran:0"
      - graph-name: "upstream2"
        direction: "upstream"
        links:
          - id: "upstream-3"
            connection-points:
              - if-id-ref: "ran:1"
              - if-id-ref: "firewall:0"
          - id: "upstream-4"
            connection-points:
              - if-id-ref: "firewall:0"
              - if-id-ref: "ros:0"
      - graph-name: "downstream2"
        direction: "downstream"
        links:
          - id: "downstream-3"
            connection-points:
              - if-id-ref: "ros:0"
              - if-id-ref: "firewall:0"
          - id: "downstream-4"
            connection-points:
              - if-id-ref: "firewall:0"
              - if-id-ref: "ran:1"
