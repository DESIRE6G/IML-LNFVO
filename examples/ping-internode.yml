lnsd:
  ## lnsd refers to a network service graph whose subgraph is described
  ns-instance-id: "11223344-e2a8-4338-bc8c-be685548bad2"
  ns:
    name: "Ping demo"
    id: "418420e3-e2a8-4338-bc8c-be685548bad2" # refers to the ns in the service catalog
    vendor: "D6G"
    descriptor-version: "1.0"
    site-id: "d6g-001"
    location-id: 40
    default-service-id: "30"
    default-nfrouter-mode: "bmv2"
    default-interpod-mode: 'br'

    site-connections: []
    unmanaged-functions: []
    network-functions: []

    application-functions:
      - instance-id: "pkt-src"
        id: "iperf3"
        name: "Pkt destination"
        version: "1.0"
        node: "epyc1"
        domain: "external"
        is-ue: true

      - instance-id: "pkt-dst"
        id: "iperf3"
        name: "Pkt source"
        version: "1.0"
        node: "epyc2"
        domain: "external"

    forwarding_graphs:
      - graph-name: "upstream"
        direction: "upstream"
        links:
          - id: "upstream-1"
            connection-points:
            - if-id-ref: "pkt-src:1"
            - if-id-ref: "pkt-dst:1"
      - graph-name: "downstream"
        direction: "downstream"
        links:
          - id: "downstream-1"
            connection-points:
            - if-id-ref: "pkt-dst:1"
            - if-id-ref: "pkt-src:1"
