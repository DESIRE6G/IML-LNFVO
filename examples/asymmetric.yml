lnsd:
  ns-instance-id: "11223344-e2a8-4338-bc8c-be685548bad2"
  ns:
    name: "Asymmetric"
    id: "418420e3-e2a8-4338-bc8c-be685548bad2"
    vendor: "D6G"
    descriptor-version: "1.0"
    site-id: "d6g-001"
    location-id: 40
    default-service-id: "30"
    default-nfrouter-mode: "bmv2"
    default-interpod-mode: 'br'

    site-connections: []

    network-functions:
      - instance-id: "reflector"
        id: "reflector-bmv2"
        name: "reflector nf"
        version: "1.0"
        node: "epyc1"

    application-functions:
      - instance-id: "pkt-dst"
        id: "iperf3"
        name: "Pkt destination"
        version: "1.0"
        node: "epyc1"
        domain: "external"

      - instance-id: "pkt-src"
        id: "iperf3"
        name: "Pkt source"
        version: "1.0"
        node: "epyc1"
        domain: "external"
        is-ue: true

    forwarding_graphs:
      - graph-name: "upstream"
        direction: "upstream"
        links:
          - id: "upstream-1"
            connection-points:
            - if-id-ref: "pkt-src:0"
            - if-id-ref: "reflector:0"
          - id: "upstream-2"
            connection-points:
            - if-id-ref: "reflector:0"
            - if-id-ref: "pkt-dst:0"
      - graph-name: "downstream"
        direction: "downstream"
        links:
          - id: "downstream-1"
            connection-points:
            - if-id-ref: "pkt-dst:0"
            - if-id-ref: "pkt-src:0"
