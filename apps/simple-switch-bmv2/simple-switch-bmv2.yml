apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-switch-bmv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-switch-bmv2
  template:
    metadata:
      labels:
        app: simple-switch-bmv2
    spec:
      initContainers:
      - name: switch
        image: desire6g/simple-switch-bmv2:latest
        imagePullPolicy: Never
        restartPolicy: Always
        securityContext:
          privileged: true
        command: [ "/bin/bash", "-c", "--" ]
        args: [ "trap : TERM INT; sleep infinity & wait" ]
        resources:
          limits:
            memory: 4Gi
          requests:
            memory: 4Gi
      containers:
      - name: simple-switch-bmv2
        image: desire6g/local-cp:latest
        imagePullPolicy: Never
        securityContext:
          privileged: true
        command: [ "/bin/bash", "-c", "--" ]
        args: [ "trap : TERM INT; sleep infinity & wait" ]
