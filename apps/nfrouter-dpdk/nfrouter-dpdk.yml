apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfrouter-dpdk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfrouter-dpdk
  template:
    metadata:
      labels:
        app: nfrouter-dpdk
    spec:
      containers:
      - name: nfrouter-dpdk
        image: desire6g/nfrouter-dpdk:latest
        imagePullPolicy: Never
        securityContext:
          privileged: true
        command: [ "/bin/bash", "-c", "--" ]
        args: [ "trap : TERM INT; sleep infinity & wait" ]
        volumeMounts:
        - name: hugepage
          mountPath: /hugepages
        resources:
          limits:
            hugepages-1Gi: 1Gi
            memory: 4Gi
            nvidia.com/cx6dx_vf: '1'
          requests:
            hugepages-1Gi: 1Gi
            memory: 4Gi
            nvidia.com/cx6dx_vf: '1'
      volumes:
      - name: hugepage
        emptyDir:
          medium: HugePages
